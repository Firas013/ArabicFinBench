name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The pre-commit hook enforces this locally, but a hook can be skipped
      # with --no-verify and is not installed in a fresh clone. Git history is
      # permanent, so this check runs before anything else.
      # See arabicfinbench/gt/CONVENTIONS.md section 6.
      - name: No corpus documents tracked
        run: |
          # Filings are never tracked. Page images are indistinguishable from
          # diagrams by extension, so they are allowed only under docs/.
          found=$(
            {
              git ls-files | grep -Ei '\.(pdf|docx|jfif)$' || true
              git ls-files | grep -Ei '\.(png|jpe?g)$' | grep -Ev '^(docs/|\.github/)' || true
            } | grep -v '^$' || true
          )
          if [ -n "$found" ]; then
            echo "ERROR: corpus document(s) tracked in the repository:" >&2
            printf '  %s\n' $found >&2
            echo "See arabicfinbench/gt/CONVENTIONS.md section 6." >&2
            exit 1
          fi
          echo "no corpus documents tracked"

      # Guard 10: the benchmark reports per dimension, raw and canon, never one
      # number. The generator refuses combined scores in code; this catches a
      # hand-edited table sneaking an overall column into a tracked file.
      - name: No overall column in leaderboard files
        run: |
          # docs/upstream_leaderboard.csv is ExtractBench's own table preserved
          # verbatim for provenance; it keeps upstream's format and is labelled
          # as not being ArabicFinBench results.
          found=$(git ls-files -z '*leaderboard*' \
            | grep -zv '^docs/upstream_leaderboard\.csv$' \
            | xargs -0 grep -liE '(^|[|,])[[:space:]]*overall[[:space:]]*([|,]|$)' 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "ERROR: 'overall' column found in leaderboard file(s):" >&2
            printf '  %s\n' $found >&2
            echo "ArabicFinBench never emits a combined score. See README." >&2
            exit 1
          fi
          echo "no overall column in tracked leaderboard files"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Lint and validate runner-free pass/skip behavior before installing heavy deps.
      - name: Sync dependencies (dev only)
        run: uv sync --locked --extra dev

      - name: Ruff format
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Pytest without runners
        run: uv run pytest tests/ -q

      - name: Sync dependencies (with runners)
        run: uv sync --locked --extra runners --extra dev

      - name: Pytest with runners
        run: uv run pytest tests/ -q
